<!doctype html>
<!--
  ChatControl vote: shows up only while a vote runs.
  OBS: Sources -> + -> Browser, URL http://localhost:8787/obs/vote.html, size 760x330 (Local file unchecked).
-->
<html>
<head>
<meta charset="utf-8">
<title>ChatControl vote</title>
<link rel="stylesheet" href="assets/ficsit.css">
<style>
  .box { position: absolute; left: 10px; top: 10px; width: 720px; padding: 22px 24px 20px; transition: opacity .4s, transform .4s; }
  .box.hidden { opacity: 0; transform: translateX(-30px); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .head .title { font-size: 30px; }
  .timer { font-size: 28px; font-weight: 700; color: var(--orange); }
  .opt { position: relative; height: 52px; margin-top: 10px; background: var(--panel-light); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(250, 149, 73, .35); transition: width .5s ease; }
  .opt.lead .fill { background: rgba(250, 149, 73, .7); }
  .row { position: relative; height: 100%; display: flex; align-items: center; gap: 16px; padding: 0 16px; font-size: 24px; font-weight: 600; }
  .key { font-weight: 700; color: var(--orange); min-width: 44px; }
  .opt.lead .key { color: var(--text); }
  .name { flex: 1; }
  .count { font-weight: 700; }
  .progress { height: 5px; margin-top: 16px; background: var(--orange); transform-origin: left; }
</style>
</head>
<body>
  <div class="box plate hidden" id="box">
    <div class="head"><div class="title" id="title"></div><div class="timer" id="timer"></div></div>
    <div id="opts"></div>
    <div class="progress" id="progress"></div>
  </div>
<script src="assets/chatcontrol.js"></script>
<script>
  const box = document.getElementById("box");
  ccZoom(box);
  ccPoll(state => {
    const vote = state && state.vote;
    box.classList.toggle("hidden", !(vote && vote.active));
    if (!vote || !vote.active) return;
    const total = vote.options.reduce((s, o) => s + o.votes, 0);
    const best = Math.max(0, ...vote.options.map(o => o.votes));
    document.getElementById("title").textContent = ccT("vote");
    document.getElementById("opts").innerHTML = vote.options.map((o, i) => `
      <div class="opt ${o.votes && o.votes === best ? "lead" : ""}">
        <div class="fill" style="width:${total ? o.votes / total * 100 : 0}%"></div>
        <div class="row"><span class="key">!${i + 1}</span><span class="name">${ccName(o.effect)}</span><span class="count">${o.votes}</span></div>
      </div>`).join("");
    document.getElementById("timer").textContent = Math.ceil(vote.secondsLeft) + " " + ccT("seconds");
    document.getElementById("progress").style.transform = `scaleX(${vote.duration ? vote.secondsLeft / vote.duration : 0})`;
  }, 500);
</script>
</body>
</html>
