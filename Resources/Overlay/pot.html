<!doctype html>
<!--
  ChatControl shared pots and top viewers.
  OBS: Sources -> + -> Browser, URL http://localhost:8787/obs/pot.html, size 640x450 (Local file unchecked).
-->
<html>
<head>
<meta charset="utf-8">
<title>ChatControl pot</title>
<link rel="stylesheet" href="assets/ficsit.css">
<style>
  .box { position: absolute; left: 10px; top: 10px; width: 620px; box-sizing: border-box; padding: 22px 22px 18px; transition: opacity .4s; }
  .box.offline { opacity: 0; }
  .item { margin-top: 12px; }
  .pot { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .goal { font-size: 30px; }
  .nums { font-size: 24px; font-weight: 700; color: var(--orange); }
  .bar { height: 16px; background: var(--panel-light); }
  .bar div { height: 100%; width: 0; transition: width .6s ease;
             background: repeating-linear-gradient(-45deg, var(--orange) 0 12px, var(--orange-dark) 12px 24px); }
  .top { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 14px; font-size: 22px; font-weight: 600; }
  .row .n { font-weight: 700; color: var(--orange); width: 30px; }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .chips { color: var(--orange); font-weight: 700; }
  .hint { margin-top: 14px; font-size: 15px; font-weight: 600; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
  <div class="box plate offline" id="box">
    <div id="potBlock">
      <div class="caption" id="label"></div>
      <div id="pots"></div>
    </div>
    <div class="top" id="top"></div>
    <div class="hint" id="hint"></div>
  </div>
<script src="assets/chatcontrol.js"></script>
<script>
  const box = document.getElementById("box");
  const potsEl = document.getElementById("pots");
  ccZoom(box);

  // Elements stay between polls, so the bars slide instead of jumping
  function renderPots(pots) {
    while (potsEl.children.length > pots.length) potsEl.lastChild.remove();
    while (potsEl.children.length < pots.length) {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `<div class="pot"><div class="goal title"></div><div class="nums"></div></div><div class="bar"><div></div></div>`;
      potsEl.appendChild(item);
    }
    pots.forEach((pot, i) => {
      const item = potsEl.children[i];
      item.querySelector(".goal").innerHTML = ccT("potFor") + " " + ccName(pot.effect);
      item.querySelector(".nums").textContent = `${pot.current} / ${pot.goal}`;
      item.querySelector(".bar div").style.width = Math.min(100, pot.goal ? pot.current / pot.goal * 100 : 0) + "%";
    });
  }

  ccPoll(state => {
    box.classList.toggle("offline", !state);
    if (!state) return;
    const pots = state.pot.pots || [];
    document.getElementById("potBlock").style.display = pots.length ? "" : "none";
    document.getElementById("label").textContent = ccT("pot");
    renderPots(pots);
    document.getElementById("top").innerHTML = (state.top || []).slice(0, 3).map((t, i) =>
      `<div class="row"><span class="n">${i + 1}</span><span class="name">${ccEsc(t.name)}</span><span class="chips">${ccEsc(t.chips)}</span></div>`).join("");
    // "!pot <chips> for BOSS · !pot titan <chips> for TITAN"
    const commands = pots.map((pot, i) => `!pot ${i ? ccEsc(pot.effect) + " " : ""}${ccEsc(ccT("chipsArg"))} ${ccT("potFor")} ${ccName(pot.effect)}`).join(" · ");
    document.getElementById("hint").innerHTML = (commands ? commands + "<br>" : "") + ccEsc(ccT("hint"));
  }, 2000);
</script>
</body>
</html>
