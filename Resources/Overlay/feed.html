<!doctype html>
<!--
  ChatControl event feed: who triggered what, raids, subs, votes.
  OBS: Sources -> + -> Browser, URL http://localhost:8787/obs/feed.html, size 560x600 (Local file unchecked).
  New events appear on top and fade out after SHOW_MS.
-->
<html>
<head>
<meta charset="utf-8">
<title>ChatControl feed</title>
<link rel="stylesheet" href="assets/ficsit.css">
<style>
  #feed { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 10px; }
  .card { padding: 16px 18px 14px 18px; font-size: 21px; font-weight: 600; line-height: 1.3;
          animation: in .35s ease-out, out .6s ease-in forwards; animation-delay: 0s, var(--life); }
  .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--orange);
                 transform-origin: left; animation: bar var(--life) linear forwards; }
  .card.alert { border-left-color: #e5484d; }
  .card.alert::after { background: #e5484d; }
  @keyframes bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes in { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes out { to { opacity: 0; transform: translateX(-30px); } }
</style>
</head>
<body>
  <div id="feed"></div>
<script src="assets/chatcontrol.js"></script>
<script>
  const SHOW_MS = 12000;   // how long one event stays
  const MAX_CARDS = 5;     // how many events are visible at once

  document.documentElement.style.setProperty("--life", SHOW_MS + "ms");
  const feed = document.getElementById("feed");
  ccZoom(feed);
  let lastId = null;

  ccPoll(state => {
    if (!state) return;
    const events = state.events || [];
    if (lastId === null) { lastId = events.length ? events[events.length - 1].id : 0; return; } // skip old events
    for (const e of events) {
      if (e.id <= lastId) continue;
      lastId = e.id;
      const card = document.createElement("div");
      card.className = "card plate" + (/БОСС|BOSS|ПАНИКА|PANIC/.test(e.text) ? " alert" : "");
      card.textContent = e.text;
      feed.prepend(card);
      setTimeout(() => card.remove(), SHOW_MS + 700);
      while (feed.children.length > MAX_CARDS) feed.lastChild.remove();
    }
  });
</script>
</body>
</html>
